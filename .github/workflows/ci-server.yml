name: ci-server

# Path-фильтр: гоняется только при изменениях бэка/фикстур. Красный = блок merge.
on:
  pull_request:
    paths: ['server/**', 'fixtures/**', '.github/workflows/ci-server.yml']
  push:
    branches: [main]
    paths: ['server/**', 'fixtures/**', '.github/workflows/ci-server.yml']

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum # go.sum появился в Story 1.2 (pgx v5) → кэш модулей включён

      - name: gofmt (нет неформатированных файлов)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...
        # Story 1.10 добавила (гоняются этим же `go test ./...`): property (median insufficient),
        # golden + contract/schema_hash (decode на дрейф), АРХИТЕКТУРНЫЙ go-list-тест границ ядра
        # (internal/arch: median/flags/normalize/benchmark не импортируют store/httpapi/goszakup/время;
        # + AC2 Story 0.6: cmd/api/importer не тянут tools/scrape — TestHotPathDoesNotImportScrape).
        # Остаётся: go test -tags=integration (testcontainers postgis).

      - name: go-list архитектурный страж ядра (без кэша)
        # -count=1 обязателен: результат `exec go list` не входит в инпуты тест-кэша → без него
        # нарушение границы в median/flags/normalize маскируется кэшем (`ok (cached)`). Story 1.10.
        run: go test -count=1 ./internal/arch/...

      - name: scrape build-tag (Story 0.6 — интерим парсер-мост вне дефолтного билда)
        # Код tools/scrape за `//go:build scrape` → дефолтные build/vet/test/lint его НЕ трогают.
        # Явно компилируем и гоняем его тесты под тегом, чтобы он не сгнил. Тег integration здесь НЕ
        # включаем — он требует DATABASE_URL (testcontainers/реальная БД — отдельный прогон).
        run: |
          go build -tags scrape ./tools/scrape/...
          go vet -tags scrape ./tools/scrape/...
          go test -tags scrape ./tools/scrape/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7 # v7+ требуется для golangci-lint v2.x (v6 = v1 only)
        with:
          version: v2.5.0
          working-directory: server
