name: ci-server

# Path-фильтр: гоняется только при изменениях бэка/фикстур. Красный = блок merge.
on:
  pull_request:
    paths: ['server/**', 'fixtures/**', 'migrations/**', '.github/workflows/ci-server.yml']
  push:
    branches: [main]
    paths: ['server/**', 'fixtures/**', 'migrations/**', '.github/workflows/ci-server.yml']

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum # go.sum появился в Story 1.2 (pgx v5) → кэш модулей включён

      - name: gofmt (нет неформатированных файлов)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...
        # Story 1.10 добавила (гоняются этим же `go test ./...`): property (median insufficient),
        # golden + contract/schema_hash (decode на дрейф), АРХИТЕКТУРНЫЙ go-list-тест границ ядра
        # (internal/arch: median/flags/normalize/benchmark не импортируют store/httpapi/goszakup/время;
        # + AC2 Story 0.6: cmd/api/importer не тянут tools/scrape — TestHotPathDoesNotImportScrape).
        # Остаётся: go test -tags=integration (testcontainers postgis).

      - name: go-list архитектурный страж ядра (без кэша)
        # -count=1 обязателен: результат `exec go list` не входит в инпуты тест-кэша → без него
        # нарушение границы в median/flags/normalize маскируется кэшем (`ok (cached)`). Story 1.10.
        run: go test -count=1 ./internal/arch/...

      - name: scrape build-tag (Story 0.6 — интерим парсер-мост вне дефолтного билда)
        # Код tools/scrape за `//go:build scrape` → дефолтные build/vet/test/lint его НЕ трогают.
        # Явно компилируем и гоняем его тесты под тегом, чтобы он не сгнил. Тег integration здесь НЕ
        # включаем — он требует DATABASE_URL (testcontainers/реальная БД — отдельный прогон).
        run: |
          go build -tags scrape ./tools/scrape/...
          go vet -tags scrape ./tools/scrape/...
          go test -tags scrape ./tools/scrape/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7 # v7+ требуется для golangci-lint v2.x (v6 = v1 only)
        with:
          version: v2.5.0
          working-directory: server

  # Story 2.6 (AC2): integration-гейт идемпотентности/выживания курации/atomic-публикации на ЧИСТОЙ
  # (мигрированной БЕЗ seed) БД. Красный = блок merge. Конвенция репо — //go:build integration + DATABASE_URL
  # (НЕ testcontainers): CI поднимает postgis/postgis сервисом. CLEAN-группа (импорт/нормализация/пересчёт/
  # outbox). SEED-группа (store/httpapi) гоняется отдельным job `integration-seed` ниже — долг изоляции
  # clean-vs-seed закрыт разделением (deferred-work.md), теперь ОБЕ группы — гейты merge.
  integration:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ashyqqala
          POSTGRES_PASSWORD: ashyqqala
          POSTGRES_DB: ashyqqala
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ashyqqala -d ashyqqala"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://ashyqqala:ashyqqala@localhost:5432/ashyqqala?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: migrate (goose, чистая БД) — из корня репо
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.27.1 -dir migrations postgres "$DATABASE_URL" up

      - name: integration (импорт/нормализация/пересчёт/outbox; -p 1 — общая БД; красный = блок merge)
        working-directory: server
        run: go test -tags=integration -count=1 -p 1 ./internal/ingest/... ./internal/store/projection/... ./internal/outbox/...

  # SEED-группа (долг изоляции clean-vs-seed, deferred-work.md): store/httpapi читают DEMO-данные (Story
  # 5.1/5.2) → гоняются на МИГРИРОВАННОЙ + ЗАСЕЯННОЙ БД (свежий postgis-сервис, изолирован от CLEAN-группы).
  # Красный = блок merge. Дополняет job `integration` выше (обе группы теперь — гейты).
  integration-seed:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ashyqqala
          POSTGRES_PASSWORD: ashyqqala
          POSTGRES_DB: ashyqqala
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ashyqqala -d ashyqqala"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://ashyqqala:ashyqqala@localhost:5432/ashyqqala?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: migrate (goose, чистая БД) — из корня репо
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.27.1 -dir migrations postgres "$DATABASE_URL" up

      - name: seed (DEMO-фикстуры Story 5.1/5.2; порядок FK contracts→acts→organizations→rnu_entries→risk_flags)
        # Все фикстуры идемпотентны (ON CONFLICT/NOT EXISTS). psql предустановлен на ubuntu-latest.
        run: |
          for f in contracts acts organizations rnu_entries risk_flags; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "fixtures/seed/$f.sql"
          done

      - name: integration-seed (store/httpapi на засеянной БД; -p 1; красный = блок merge)
        working-directory: server
        run: go test -tags=integration -count=1 -p 1 ./internal/store ./internal/httpapi/...
