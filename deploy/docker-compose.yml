# ГОРЯЧИЙ стек (один VPS, РК). Профиль `app` = сквозной walking skeleton (Story 1.7):
# `docker compose --profile app up` → db → migrate(goose) → seed(DEMO-0001) → api(chi) → caddy(SPA+/api).
# Без профиля `docker compose up db` поднимает только БД (как в 1.1).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ashyqqala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ashyqqala}
      POSTGRES_DB: ${POSTGRES_DB:-ashyqqala}
    ports:
      # bind только на localhost (дев-БД не торчит наружу; дефолт-пароль в .env.example — placeholder)
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ashyqqala} -d ${POSTGRES_DB:-ashyqqala}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Миграции схемы (goose) — one-shot до api. Тот же вызов, что в Makefile migrate-up.
  migrate:
    profiles: ['app']
    image: golang:1.25-alpine
    working_dir: /work
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ashyqqala}:${POSTGRES_PASSWORD:-ashyqqala}@db:5432/${POSTGRES_DB:-ashyqqala}?sslmode=disable
    volumes:
      - ../migrations:/work/migrations:ro
    command: ['sh', '-c', 'go run github.com/pressly/goose/v3/cmd/goose@v3.27.1 -dir migrations postgres "$$DATABASE_URL" up']
    depends_on:
      db:
        condition: service_healthy

  # Seed демо-строки DEMO-0001 (psql из postgis-образа) — one-shot после миграций.
  seed:
    profiles: ['app']
    image: postgis/postgis:16-3.4
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-ashyqqala}
    volumes:
      - ../fixtures:/fixtures:ro
    command:
      [
        'sh',
        '-c',
        'psql -h db -U ${POSTGRES_USER:-ashyqqala} -d ${POSTGRES_DB:-ashyqqala} -v ON_ERROR_STOP=1 -f /fixtures/seed/contracts.sql',
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    profiles: ['app']
    build:
      context: ../server
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ashyqqala}:${POSTGRES_PASSWORD:-ashyqqala}@db:5432/${POSTGRES_DB:-ashyqqala}?sslmode=disable
      API_ADDR: ':8080'
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  caddy:
    profiles: ['app']
    build:
      context: ../web
      dockerfile: Dockerfile
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api

volumes:
  db_data:
